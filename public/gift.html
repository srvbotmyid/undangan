<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amplop — Nara &amp; Ilyas</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="topnav">
    <a href="/">Nara &amp; Ilyas</a>
    <div class="links">
      <a href="/gift">Amplop</a>
      <a href="/">Ucapan</a>
      <a href="/galeri">Galeri</a>
    </div>
  </nav>

  <header class="hero">
    <p>Kepada Yth.</p>
    <h1>Amplop Digital</h1>
    <p>Kehadiran sudah cukup. Kalau ingin mengirim tanda kasih, rekeningnya di bawah.</p>
  </header>

  <main class="wrap">
    <section class="card" id="gift">
      <h2>BCA</h2>
      <p class="muted">a.n. Nadita Ranasya</p>
      <div class="gift-row">
        <div><code id="rek1">7314191995</code></div>
        <button class="btn btn-small" data-copy="rek1">Salin</button>
      </div>
      <div class="cta-sticky">
        <a href="/" class="btn btn-primary" id="btnGiftNext">Isi kartu ucapan</a>
      </div>
    </section>
  </main>

  <footer>
    <a href="/">Kartu ucapan</a> · <a href="/galeri">Galeri</a>
  </footer>

  <script>
    const GIFT_KEY = 'gift_unlocked';
    document.querySelectorAll('[data-copy]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const text = document.getElementById(btn.getAttribute('data-copy'))?.textContent?.trim() || '';
        try {
          await navigator.clipboard.writeText(text);
          btn.textContent = 'Tersalin';
          setTimeout(() => (btn.textContent = 'Salin'), 1500);
        } catch (e) { prompt('Salin nomor ini:', text); }
        try { localStorage.setItem(GIFT_KEY, '1'); } catch {}
      });
    });
    document.getElementById('btnGiftNext')?.addEventListener('click', () => {
      try { localStorage.setItem(GIFT_KEY, '1'); } catch {}
    });
  </script>
</body>
</html>
